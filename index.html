<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>404</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="frame">
    <div class="scanline"></div>
    <div class="content">
      <div class="status">
        <span class="status-code">404</span>
        <span class="status-label">SYSTEM OFFLINE</span>
      </div>

      <div class="page-title"></div>

      <p class="lead">
        If you are seeing this page, it means:
      </p>

      <ol class="reasons">
        <li data-color="r">The power bill wasn't paid.</li>
        <li data-color="g">The internet bill wasn't paid.</li>
        <li data-color="b">The Host Maintainer is away.</li>
        <li data-color="rgb">A drive is missing.</li>
      </ol>

      <div class="minigame">
        <div class="minigame-label">Signal fragments</div>
        <div class="minigame-area">
          <div class="minigame-orb"></div>
        </div>
        <div class="minigame-status">
          Fragments captured: <span>0</span>/5
        </div>
      </div>
    </div>
  </div>

  <script src="script.js" type="module"></script>
</body>
</html>
